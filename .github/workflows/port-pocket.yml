name: Port Pocket APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/port-pocket/**'
      - '.github/workflows/port-pocket.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/port-pocket
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Port-Pocket-Android
          path: projects/port-pocket/build/outputs/apk/debug/*.apk
          if-no-files-found: error
