name: Publish Port Pocket 1.1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/port-pocket-release-1-1.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Port-Pocket-Android
          run-id: 45730738165
          github-token: ${{ github.token }}
          path: package
      - name: Publish verified build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cp package/*.apk Port-Pocket-1.1.apk
          gh release create port-pocket-v1.1 Port-Pocket-1.1.apk --repo "$REPO" --target ffe8628cf3049dd0418105b480aaa936e4e8812a --title 'Port Pocket 1.1 for Android' --notes 'Download Port-Pocket-1.1.apk on Android 8 or later. This is the debug-signed build from the Port Pocket workflow.'
